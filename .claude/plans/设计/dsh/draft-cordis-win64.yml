# CLFCode Windows 版 dsh runtime 组合草案（draft，待 spike 验证）
# 基于 examples/jsonrpc-agent/cordis.yml 完整版改造：
#   - bash 行 → pwsh 三件套（Windows 无 PTY/持久 bash）
#   - 保留 fs / todo / subagent / sessions / compaction
# 状态：draft — 未实测，字段以钉住版本 47f943859bef60e4160492346772ded9b24f765a 源码为准

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# --- Windows 命令执行面：pwsh 三件套（替代 POSIX-only 的 bash） ---

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  config:
    mode: read-only            # 待定：与 CLFCode 四模式职责切分（决策点 3）

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  config:
    enableRunInBackground: false

# --- agent 骨架 ---

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

# --- 会话持久化 + 上下文压缩 ---

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# --- 子代理 + todo + fs 工具（平台无关，Windows 可用） ---

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
