# CLFCode spike S0 冒烟版 cordis（零 !!js 表达式 + 深检修正沙箱装配）
# 与 dsh 参考目录 draft-cordis-win64.yml 的差异：
#   1. 路径全部硬编码（workspace / sessions 位于本目录下）
#   2. 修正：mode/workspaceRoot 属于 dsh-sandbox-policy（draft 错挂在 pwsh-sandbox）
#   3. 新增 dsh-sandbox-local + dsh-sandbox-policy 装配件（缺件必启动失败）
#   4. sessions compression: none（排障可读）

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# --- 命令执行面：subprocess + 沙箱装配（深检修正） ---

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: read-only
    workspaceRoot: 'F:\wjh_work\ProjectCliom\CLFCode\.claude\plans\测试\spike\workspace'

# 注意：pwsh-local 与 pwsh-sandbox 同注册 ctx.shell 服务（二选一）——
# pwsh-sandbox 内部继承 PwshLocalExecutor，只挂 sandbox 版即得受限 shell
- id: pwsh-sandbox
  # examples/node_modules 链接场缺 dsh-pwsh-sandbox（无示例引用它），
  # 改走相对路径直接指仓库内已构建的包（loader 支持 name 以 . 开头的相对引用）
  name: '../../../../deepseek-harness/packages/shell/pwsh-sandbox/lib/index.js'
  config:
    cwd: 'F:\wjh_work\ProjectCliom\CLFCode\.claude\plans\测试\spike\workspace'
    timeoutMs: 60000

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  config:
    enableRunInBackground: false

# --- agent 骨架 ---

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

# --- 会话持久化 + 上下文压缩 ---

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: 'F:\wjh_work\ProjectCliom\CLFCode\.claude\plans\测试\spike\sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# --- 子代理 + todo + fs 工具（平台无关，Windows 可用） ---

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: 'F:\wjh_work\ProjectCliom\CLFCode\.claude\plans\测试\spike\workspace'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
